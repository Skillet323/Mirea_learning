    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        .canvas {
            flex-grow: 1;
            width: 100%;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        #buttons-container {
            display: flex;
            flex-direction: row;
            justify-content: center;
            padding: 10px;
            background-color: #f4f4f4;
        }

        #buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        #buttons button {
            padding: 10px 20px;
            font-size: 16px;
            border: none;
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
            border-radius: 5px;
            display: flex;
            align-items: center;
            transition: background-color 0.3s ease;
        }

        #buttons button i {
            margin-right: 8px;
        }

        #buttons button:hover {
            background-color: #45a049;
        }

        #fileInput {
            display: none;
        }

        .bjs-powered-by {
            display: none;
        }

        /* Стили для попапов */
        .popup-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: 10000;
        }

        .popup {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            z-index: 10001;
            width: 400px;
            max-width: 90%;
            text-align: center;
        }

        .popup h3 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 24px;
            color: #333;
        }

        .popup .link-container,
        .popup .export-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .popup input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            margin-right: 10px;
        }

        .popup button.copy-button,
        .popup button.export-button {
            padding: 10px 20px;
            background-color: #2196F3;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            font-size: 14px;
            transition: background-color 0.3s ease;
        }

        .popup button.copy-button:hover,
        .popup button.export-button:hover {
            background-color: #0b7dda;
        }

        .popup button#closePopup {
            padding: 10px 20px;
            background-color: #f44336;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            font-size: 16px;
            transition: background-color 0.3s ease;
        }

        .popup button#closePopup:hover {
            background-color: #da190b;
        }

        /* Стили для меню-бургера */
        .burger-menu {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 30px;
            cursor: pointer;
            z-index: 10001;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .burger-line {
            width: 100%;
            height: 5px;
            background-color: black;
            transition: all 0.3s ease;
        }

        .menu {
            position: fixed;
            top: 0;
            right: -100%;
            width: 300px;
            height: 100vh;
            background-color: #333;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: right 0.3s ease;
            z-index: 10000;
        }

        .menu.open {
            right: 0;
        }

        .menu a {
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            text-decoration: none;
            background-color: rgb(63, 63, 63);
            font-size: 18px;
            margin: 20px 0;
            width: 80%;
            height: 50px;
            transition: background-color 0.3s ease;
            border-radius: 5px;
        }

        .menu a:hover {
            background-color: #555;
        }

        .burger-menu.open .burger-line:nth-child(1) {
            transform: rotate(45deg) translate(6px, 8px);
        }

        .burger-menu.open .burger-line:nth-child(2) {
            opacity: 0;
        }

        .burger-menu.open .burger-line:nth-child(3) {
            transform: rotate(-45deg) translate(6px, -8px);
        }
    </style>

    <!-- Подключаем BPMN.js -->

    <script>
        var bpmnModeler = new BpmnJS({
            container: '#canvas',
            keyboard: {
                bindTo: document
            }
        });
        const clipboard = bpmnModeler.get('clipboard');
        const copyPaste = bpmnModeler.get('copyPaste');
        const elementRegistry = bpmnModeler.get('elementRegistry');
        const selection = bpmnModeler.get('selection');
        const moddle = bpmnModeler.get('moddle');

        let lastCopiedElements = null;

        // Функция для получения параметра из URL
        function getDiagramFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('diagram'); // Получаем параметр diagram
        }

        // Загрузка диаграммы по URL
        async function loadDiagramFromUrl(diagramData) {
            try {
                const response = await fetch(`./diagrams/${diagramData}`);
                if (!response.ok) throw new Error('Диаграмма не найдена');
                const xml = await response.text();
                await bpmnModeler.importXML(xml);
                bpmnModeler.get('canvas').zoom('fit-viewport');
                console.log('Схема успешно загружена из ссылки!');
            } catch (error) {
                console.error('Ошибка при загрузке схемы из ссылки:', error);
                alert('Не удалось загрузить диаграмму по ссылке.');
            }
        }

        // Инициализация: загрузка диаграммы из ссылки или по умолчанию
        const diagramData = getDiagramFromUrl();
        if (diagramData) {
            loadDiagramFromUrl(diagramData);
        } else {
            loadDiagram();
        }

        async function loadDiagram() {
            const xml = `<?xml version="1.0" encoding="UTF-8"?>
                <bpmn:definitions xmlns:bpmn="http://www.omg.org/spec/BPMN/20100524/MODEL" 
                                  xmlns:bpmndi="http://www.omg.org/spec/BPMN/20100524/DI" 
                                  xmlns:dc="http://www.omg.org/spec/DD/20100524/DC" 
                                  xmlns:di="http://www.omg.org/spec/DD/20100524/DI" 
                                  id="Definitions_1" 
                                  targetNamespace="http://bpmn.io/schema/bpmn">
                    <bpmn:process id="Process_1" isExecutable="false">
                        <bpmn:startEvent id="StartEvent_1"/>
                    </bpmn:process>
                    <bpmndi:BPMNDiagram id="BPMNDiagram_1">
                        <bpmndi:BPMNPlane id="BPMNPlane_1" bpmnElement="Process_1">
                            <bpmndi:BPMNShape id="StartEvent_1_di" bpmnElement="StartEvent_1">
                                <dc:Bounds x="173" y="102" width="36" height="36"/>
                            </bpmndi:BPMNShape>
                        </bpmndi:BPMNPlane>
                    </bpmndi:BPMNDiagram>
                </bpmn:definitions>`;
            try {
                await bpmnModeler.importXML(xml);
                console.log('Диаграмма по умолчанию загружена.');
            } catch (err) {
                console.error('Ошибка при загрузке диаграммы по умолчанию:', err);
            }
        }
        function createReviver(moddle) {
            const elCache = {};

            return function(key, object) {
                if (typeof object === 'object' && typeof object.$type === 'string') {
                    const objectId = object.id;

                    // Используем закэшированные элементы, если они уже существуют
                    if (objectId && elCache[objectId]) {
                        return elCache[objectId];
                    }

                    const type = object.$type;
                    const attrs = Object.assign({}, object);
                    delete attrs.$type;

                    // Создаём новый элемент модели
                    const newEl = moddle.create(type, attrs);

                    if (objectId) {
                        elCache[objectId] = newEl;
                    }

                    return newEl;
                }

                return object;
            };
        }

        // Обработчики для копирования и вставки элементов
        document.getElementById('copy-elements').addEventListener('click', function() {
            const selectedElements = selection.get(); // Получаем все выбранные элементы
            
            const clipboard = bpmnModeler.get('clipboard'),
                copyPaste = bpmnModeler.get('copyPaste'),
                elementRegistry = bpmnModeler.get('elementRegistry');

            if (selectedElements.length) {
                // Копируем все выделенные элементы
                copyPaste.copy(selectedElements);

                // Получаем содержимое буфера обмена
                const copied = clipboard.get();

                // Сохраняем данные в LocalStorage
                localStorage.setItem('bpmnClipboard', JSON.stringify(copied));

                console.log('Элементы успешно скопированы и сохранены в LocalStorage.');
            } else {
                console.log('Нет элементов для копирования.');
            }
        });
        document.addEventListener('keydown', function(event) {
            if (event.ctrlKey && event.key === 'c') {
                const selectedElements = selection.get();

                if (selectedElements.length) {
                    const clipboard = bpmnModeler.get('clipboard'),
                        copyPaste = bpmnModeler.get('copyPaste');
                    
                    // Копируем элементы
                    copyPaste.copy(selectedElements);

                    // Получаем содержимое буфера обмена
                    const copied = clipboard.get();

                    // Сохраняем данные в LocalStorage
                    localStorage.setItem('bpmnClipboard', JSON.stringify(copied));

                    console.log('Элементы успешно скопированы и сохранены в LocalStorage.');
                } else {
                    console.log('Нет элементов для копирования.');
                }
            }
        });
document.addEventListener('keydown', function(event) {
    if (event.ctrlKey && event.key === 'v') {
        const clipboard = bpmnModeler.get('clipboard'),
            copyPaste = bpmnModeler.get('copyPaste'),
            elementRegistry = bpmnModeler.get('elementRegistry'),
            moddle = bpmnModeler.get('moddle'),
            canvas = bpmnModeler.get('canvas');

        // Получаем данные из LocalStorage
        const serializedCopy = localStorage.getItem('bpmnClipboard');

        if (!serializedCopy) {
            console.error('Буфер обмена пуст, данные не найдены.');
            return;
        }

        // Восстанавливаем элементы из JSON с помощью ревивера
        const parsedCopy = JSON.parse(serializedCopy, createReviver(moddle));

        // Вставляем элементы в буфер обмена
        clipboard.set(parsedCopy);

        // Определяем центр холста
        const viewbox = canvas.viewbox();
        const centerX = viewbox.x + viewbox.width / 2;
        const centerY = viewbox.y + viewbox.height / 2;

        // Вставляем элементы в центр холста
        copyPaste.paste({
            element: elementRegistry.get(canvas.getRootElement().id),
            point: { x: centerX, y: centerY }
        });

        console.log('Элементы успешно вставлены в центр холста через Ctrl+V.');

        // Очищаем LocalStorage после вставки
        localStorage.removeItem('bpmnClipboard');
        console.log('LocalStorage очищен после вставки.');
    }
});

        document.getElementById('save-diagram').addEventListener('click', async function() {
            try {
                const { xml } = await bpmnModeler.saveXML({ format: true });
                const blob = new Blob([xml], { type: 'application/xml' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'diagram.bpmn';
                document.body.appendChild(a);
                a.click();
                setTimeout(() => document.body.removeChild(a), 0);
                console.log('Диаграмма сохранена!');
            } catch (err) {
                console.error('Ошибка при сохранении:', err);
            }
        });

        document.getElementById('open-file').addEventListener('click', function() {
            document.getElementById('fileInput').click();
        });

        document.getElementById('fileInput').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    await bpmnModeler.importXML(e.target.result);
                    console.log('Диаграмма загружена.');
                } catch (err) {
                    console.error('Ошибка при загрузке файла:', err);
                }
            };
            reader.readAsText(file);
        });

        // Обработчик для получения ссылки
        document.getElementById('get-link').addEventListener('click', async function() {
            try {
                const { xml } = await bpmnModeler.saveXML({ format: true });

                // Создаём форму данных для отправки на сервер
                const formData = new FormData();
                const blob = new Blob([xml], { type: 'application/xml' });
                formData.append('diagram', blob, 'diagram.bpmn');

                // Отправляем диаграмму на сервер
                const response = await fetch('save_diagram.php', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error('Ошибка при сохранении диаграммы на сервере');

                const result = await response.json();

                if (result.error) throw new Error(result.error);

                const shareUrl = result.link;

                // Показываем ссылку в попапе
                const popup = document.getElementById('popup');
                const overlay = document.getElementById('popupOverlay');
                const linkField = document.getElementById('diagramLink');
                const copyButton = document.getElementById('copyLink');

                linkField.value = shareUrl;
                popup.style.display = 'block';
                overlay.style.display = 'block';

                // Очистка предыдущих обработчиков
                copyButton.onclick = null;

                // Обработчик для копирования ссылки
                copyButton.addEventListener('click', function() {
                    linkField.select();
                    linkField.setSelectionRange(0, 99999); // Для мобильных устройств

                    // Копирование текста
                    navigator.clipboard.writeText(linkField.value)
                        .then(() => {
                            console.log('Ссылка скопирована в буфер обмена!');
                        })
                        .catch(err => {
                            console.error('Ошибка при копировании:', err);
                            console.log('Не удалось скопировать ссылку. Пожалуйста, скопируйте её вручную.');
                        });
                }, { once: true }); // Обработчик срабатывает только один раз

            } catch (err) {
                console.error('Ошибка при получении ссылки:', err);
                alert('Не удалось получить ссылку: ' + err.message);
            }
        });

        // Закрытие попапа для ссылки
        document.getElementById('closePopup').addEventListener('click', function() {
            document.getElementById('popup').style.display = 'none';
            document.getElementById('popupOverlay').style.display = 'none';
        });

        // Закрытие попапа при клике на оверлей
        document.getElementById('popupOverlay').addEventListener('click', function() {
            document.getElementById('popup').style.display = 'none';
            document.getElementById('popupOverlay').style.display = 'none';
        });

        // Обработчик кнопки "Экспортировать диаграмму"
        document.getElementById('export-diagram').addEventListener('click', function() {
            const exportPopup = document.getElementById('exportPopup');
            const exportOverlay = document.getElementById('exportPopupOverlay');
            exportPopup.style.display = 'block';
            exportOverlay.style.display = 'block';
        });

        // Закрытие попапа экспорта
        document.getElementById('closeExportPopup').addEventListener('click', function() {
            document.getElementById('exportPopup').style.display = 'none';
            document.getElementById('exportPopupOverlay').style.display = 'none';
        });

        // Закрытие попапа экспорта при клике на оверлей
        document.getElementById('exportPopupOverlay').addEventListener('click', function() {
            document.getElementById('exportPopup').style.display = 'none';
            document.getElementById('exportPopupOverlay').style.display = 'none';
        });

        // Обработчик для подтверждения экспорта
        document.getElementById('confirmExport').addEventListener('click', async function() {
            const format = document.getElementById('exportFormat').value;
            if (format === 'svg') {
                try {
                    const { svg } = await bpmnModeler.saveSVG();
                    const blob = new Blob([svg], { type: 'image/svg+xml' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = 'diagram.svg';
                    document.body.appendChild(a);
                    a.click();
                    setTimeout(() => document.body.removeChild(a), 0);
                    console.log('SVG экспортирован!');
                    alert('Диаграмма успешно экспортирована в формате SVG.');
                } catch (err) {
                    console.error('Ошибка при экспорте SVG:', err);
                    alert('Не удалось экспортировать диаграмму в формате SVG.');
                }
            } else if (format === 'png') {
                try {
                    const { svg } = await bpmnModeler.saveSVG();
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    const v = document.createElement('div');
                    v.innerHTML = svg;
                    const svgElement = v.querySelector('svg');

                    // Настройка размеров канваса
                    const width = parseFloat(svgElement.getAttribute('width')) || 800;
                    const height = parseFloat(svgElement.getAttribute('height')) || 600;
                    canvas.width = width;
                    canvas.height = height;

                    // Сериализация SVG и создание изображения
                    const svgData = new XMLSerializer().serializeToString(svgElement);
                    const img = new Image();
                    const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
                    const url = URL.createObjectURL(svgBlob);

                    img.onload = function() {
                        ctx.drawImage(img, 0, 0);
                        URL.revokeObjectURL(url);
                        const pngData = canvas.toDataURL('image/png');
                        const a = document.createElement('a');
                        a.href = pngData;
                        a.download = 'diagram.png';
                        document.body.appendChild(a);
                        a.click();
                        setTimeout(() => document.body.removeChild(a), 0);
                        console.log('PNG экспортирован!');
                        alert('Диаграмма успешно экспортирована в формате PNG.');
                    };

                    img.onerror = function(err) {
                        console.error('Ошибка при загрузке изображения SVG:', err);
                        alert('Не удалось экспортировать диаграмму в формате PNG.');
                    };

                    img.src = url;
                } catch (err) {
                    console.error('Ошибка при экспорте PNG:', err);
                    alert('Не удалось экспортировать диаграмму в формате PNG.');
                }
            } else {
                alert('Выберите формат экспорта.');
            }

            // Закрытие попапа после экспорта
            document.getElementById('exportPopup').style.display = 'none';
            document.getElementById('exportPopupOverlay').style.display = 'none';
        });

        // Бургер-меню функционал
        const burgerMenu = document.getElementById('burgerMenu');
        const menu = document.getElementById('menu');
        burgerMenu.addEventListener('click', () => {
            burgerMenu.classList.toggle('open');
            menu.classList.toggle('open');
        });
    </script>
