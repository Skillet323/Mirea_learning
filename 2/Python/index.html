
<!DOCTYPE html>
<html>
<head>
    <title>Лабиринт</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 1200px; margin: 0 auto; background: #1a1a1a; }
        #room {
            padding: 20px;
            background: #2d2d2d;
            border-radius: 8px;
            margin: 20px 0;
            color: white;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            position: relative;
        }
        #room img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        #room-text {
            margin-top: 20px;
        }
        #actions {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
        }
        button {
            padding: 15px 30px;
            background: #3d3d3d;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
            min-width: 200px;
        }
        button:hover {
            background: #5d5d5d;
        }
    </style>
</head>
<body>
    <div id="room">
        <img id="room-image" src="" alt="Комната">

    <img src="labirint.png" style="max-width: 100%; margin-top: 20px;">
    <script>
        const rooms = {"1": {"title": "\u041a\u043e\u043c\u043d\u0430\u0442\u0430 #1", "description": "\u0412\u044b \u0441\u0442\u043e\u0438\u0442\u0435 \u0443 \u0432\u044b\u0441\u043e\u043a\u0438\u0445, \u0434\u0440\u0435\u0432\u043d\u0438\u0445 \u0432\u043e\u0440\u043e\u0442, \u0432\u0435\u0434\u0443\u0449\u0438\u0445 \u0432 \u043b\u0430\u0431\u0438\u0440\u0438\u043d\u0442, \u0447\u044c\u0438 \u0441\u0442\u0435\u043d\u044b \u0443\u0445\u043e\u0434\u044f\u0442 \u0432 \u0442\u0443\u043c\u0430\u043d, \u0441\u043a\u0440\u044b\u0432\u0430\u044f \u0435\u0433\u043e \u0442\u0430\u0439\u043d\u044b. \u0412\u043e\u0437\u0434\u0443\u0445 \u0437\u0434\u0435\u0441\u044c \u043f\u0440\u043e\u0445\u043b\u0430\u0434\u043d\u044b\u0439, \u0438 \u0433\u0434\u0435-\u0442\u043e \u0432\u0434\u0430\u043b\u0435\u043a\u0435 \u0441\u043b\u044b\u0448\u0438\u0442\u0441\u044f \u044d\u0445\u043e \u043a\u0430\u043f\u0430\u044e\u0449\u0435\u0439 \u0432\u043e\u0434\u044b. \u0421\u043c\u043e\u0436\u0435\u0442\u0435 \u043b\u0438 \u0432\u044b \u043d\u0430\u0439\u0442\u0438 \u0432\u044b\u0445\u043e\u0434?", "actions": [{"text": "\u041f\u0440\u043e\u0445\u043e\u0434 \u043d\u0430 \u0437\u0430\u043f\u0430\u0434. \u0412\u0430\u0448\u0438 \u0448\u0430\u0433\u0438 \u044d\u0445\u043e\u043c \u0440\u0430\u0437\u0434\u0430\u044e\u0442\u0441\u044f \u043f\u043e \u043a\u043e\u0440\u0438\u0434\u043e\u0440\u0443, \u0443\u0432\u043e\u0434\u044f\u0449\u0435\u043c\u0443 \u0432\u0433\u043b\u0443\u0431\u044c \u043b\u0430\u0431\u0438\u0440\u0438\u043d\u0442\u0430.", "next": "2"}]}, "2": {"title": "\u041a\u043e\u043c\u043d\u0430\u0442\u0430 #2", "description": "\u0412\u044b \u043d\u0430\u0445\u043e\u0434\u0438\u0442\u0435\u0441\u044c \u0432 \u0443\u0437\u043a\u043e\u0439, \u0438\u0437\u0432\u0438\u043b\u0438\u0441\u0442\u043e\u0439 \u043a\u043e\u043c\u043d\u0430\u0442\u0435, \u0433\u0434\u0435 \u0441\u0442\u0435\u043d\u044b \u0443\u043a\u0440\u0430\u0448\u0435\u043d\u044b \u0434\u0440\u0435\u0432\u043d\u0438\u043c\u0438 \u0440\u0443\u043d\u0430\u043c\u0438, \u0441\u0432\u0435\u0442\u044f\u0449\u0438\u043c\u0438\u0441\u044f \u043f\u0440\u0438 \u0441\u043b\u0430\u0431\u043e\u043c \u0441\u0432\u0435\u0442\u0435. \u041a\u0430\u0436\u0435\u0442\u0441\u044f, \u0447\u0442\u043e \u043a\u0430\u0436\u0434\u0430\u044f \u0440\u0443\u043d\u0430 \u043d\u0435\u0441\u0451\u0442 \u0441\u0432\u043e\u0451 \u0441\u043e\u043e\u0431\u0449\u0435\u043d\u0438\u0435.", "actions": [{"text": "\u041f\u0440\u043e\u0445\u043e\u0434 \u043d\u0430 \u0437\u0430\u043f\u0430\u0434. \u041f\u0443\u0442\u044c \u0438\u0434\u0451\u0442 \u0434\u0430\u043b\u044c\u0448\u0435, \u0441\u043a\u0440\u044b\u0432\u0430\u044f\u0441\u044c \u0432 \u0442\u0435\u043d\u0438.", "next": "3"}, {"text": "\u041f\u0440\u043e\u0445\u043e\u0434 \u043d\u0430 \u0432\u043e\u0441\u0442\u043e\u043a. \u0412\u044b \u043c\u043e\u0436\u0435\u0442\u0435 \u0432\u0435\u0440\u043d\u0443\u0442\u044c\u0441\u044f \u043d\u0430\u0437\u0430\u0434.", "next": "1"}]}, "3": {"title": "\u041a\u043e\u043c\u043d\u0430\u0442\u0430 #3", "description": "\u042d\u0442\u0430 \u043a\u043e\u043c\u043d\u0430\u0442\u0430 \u043d\u0430\u043f\u043e\u043c\u0438\u043d\u0430\u0435\u0442 \u043f\u043e\u0434\u0437\u0435\u043c\u043d\u043e\u0435 \u043e\u0437\u0435\u0440\u043e. \u0412\u043e\u0434\u0430 \u043c\u0435\u0440\u0446\u0430\u0435\u0442 \u0437\u0435\u043b\u0451\u043d\u044b\u043c \u0441\u0432\u0435\u0442\u043e\u043c, \u043e\u0442\u0440\u0430\u0436\u0430\u044f \u0441\u0442\u0440\u0430\u043d\u043d\u044b\u0435 \u0444\u043e\u0440\u043c\u044b \u043d\u0430 \u0441\u0442\u0435\u043d\u0430\u0445. \u0412 \u0446\u0435\u043d\u0442\u0440\u0435 \u043a\u043e\u043c\u043d\u0430\u0442\u044b \u0441\u0442\u043e\u0438\u0442 \u0434\u0440\u0435\u0432\u043d\u0438\u0439 \u043a\u0430\u043c\u0435\u043d\u043d\u044b\u0439 \u0430\u043b\u0442\u0430\u0440\u044c.", "actions": [{"text": "\u041f\u0440\u043e\u0445\u043e\u0434 \u043d\u0430 \u0441\u0435\u0432\u0435\u0440. \u041f\u0443\u0442\u044c \u0432\u0435\u0434\u0451\u0442 \u0447\u0435\u0440\u0435\u0437 \u043f\u0435\u0449\u0435\u0440\u0443, \u043d\u0430\u043f\u043e\u043b\u043d\u0435\u043d\u043d\u0443\u044e \u044d\u0445\u043e\u043c \u043a\u0430\u043f\u0430\u044e\u0449\u0435\u0439 \u0432\u043e\u0434\u044b.", "next": "4"}, {"text": "\u041f\u0440\u043e\u0445\u043e\u0434 \u043d\u0430 \u0432\u043e\u0441\u0442\u043e\u043a. \u041f\u0443\u0442\u044c \u043e\u0431\u0440\u0430\u0442\u043d\u043e \u043a \u0440\u0443\u043d\u0430\u043c.", "next": "2"}]}, "4": {"title": "\u041a\u043e\u043c\u043d\u0430\u0442\u0430 #4", "description": "\u0412\u044b \u043e\u043a\u0430\u0437\u0430\u043b\u0438\u0441\u044c \u0432 \u043e\u0433\u0440\u043e\u043c\u043d\u043e\u0439 \u0437\u0430\u043b\u0435, \u043f\u043e\u0434\u0434\u0435\u0440\u0436\u0438\u0432\u0430\u0435\u043c\u043e\u0439 \u043a\u043e\u043b\u043e\u043d\u043d\u0430\u043c\u0438 \u0438\u0437 \u0447\u0451\u0440\u043d\u043e\u0433\u043e \u043a\u0430\u043c\u043d\u044f. \u0412 \u0446\u0435\u043d\u0442\u0440\u0435 \u0437\u0430\u043b\u044b \u0433\u043e\u0440\u0438\u0442 \u0432\u0435\u0447\u043d\u044b\u0439 \u043e\u0433\u043e\u043d\u044c, \u043e\u0441\u0432\u0435\u0449\u0430\u044f \u0434\u0440\u0435\u0432\u043d\u0438\u0435 \u0444\u0440\u0435\u0441\u043a\u0438 \u043d\u0430 \u0441\u0442\u0435\u043d\u0430\u0445.", "actions": [{"text": "\u041f\u0440\u043e\u0445\u043e\u0434 \u043d\u0430 \u0441\u0435\u0432\u0435\u0440. \u041f\u0443\u0442\u044c \u0432\u0435\u0434\u0451\u0442 \u0447\u0435\u0440\u0435\u0437 \u0442\u0430\u0438\u043d\u0441\u0442\u0432\u0435\u043d\u043d\u0443\u044e \u0434\u0432\u0435\u0440\u044c, \u0443\u043a\u0440\u0430\u0448\u0435\u043d\u043d\u0443\u044e \u0441\u0438\u043c\u0432\u043e\u043b\u0430\u043c\u0438.", "next": "5"}, {"text": "\u041f\u0440\u043e\u0445\u043e\u0434 \u043d\u0430 \u044e\u0433. \u0412\u044b \u043c\u043e\u0436\u0435\u0442\u0435 \u0432\u0435\u0440\u043d\u0443\u0442\u044c\u0441\u044f \u043a \u043e\u0437\u0435\u0440\u0443.", "next": "3"}]}, "5": {"title": "\u041a\u043e\u043c\u043d\u0430\u0442\u0430 #5", "description": "\u042d\u0442\u0430 \u043a\u043e\u043c\u043d\u0430\u0442\u0430 \u043d\u0430\u043f\u043e\u043b\u043d\u0435\u043d\u0430 \u0441\u0442\u0440\u0430\u043d\u043d\u044b\u043c\u0438 \u0437\u0432\u0443\u043a\u0430\u043c\u0438, \u043f\u043e\u0445\u043e\u0436\u0438\u043c\u0438 \u043d\u0430 \u0448\u0451\u043f\u043e\u0442 \u0432\u0435\u0442\u0440\u0430. \u041d\u0430 \u0441\u0442\u0435\u043d\u0430\u0445 \u0432\u0438\u0441\u044f\u0442 \u0441\u0442\u0430\u0440\u0438\u043d\u043d\u044b\u0435 \u043a\u043e\u0432\u0440\u044b, \u0438\u0437\u043e\u0431\u0440\u0430\u0436\u0430\u044e\u0449\u0438\u0435 \u0441\u0446\u0435\u043d\u044b \u0438\u0437 \u043b\u0435\u0433\u0435\u043d\u0434.", "actions": [{"text": "\u041f\u0440\u043e\u0445\u043e\u0434 \u043d\u0430 \u044e\u0433. \u041e\u0431\u0440\u0430\u0442\u043d\u043e \u043a \u043e\u0433\u043d\u044e \u0438 \u0444\u0440\u0435\u0441\u043a\u0430\u043c.", "next": "4"}, {"text": "\u041f\u0440\u043e\u0445\u043e\u0434 \u043d\u0430 \u0432\u043e\u0441\u0442\u043e\u043a. \u041f\u0443\u0442\u044c \u0432\u0435\u0434\u0451\u0442 \u0447\u0435\u0440\u0435\u0437 \u0442\u0451\u043c\u043d\u044b\u0439 \u043a\u043e\u0440\u0438\u0434\u043e\u0440.", "next": "6"}]}, "6": {"title": "\u041a\u043e\u043c\u043d\u0430\u0442\u0430 #6", "description": "\u0412\u044b \u043d\u0430\u0445\u043e\u0434\u0438\u0442\u0435\u0441\u044c \u0432 \u043a\u043e\u043c\u043d\u0430\u0442\u0435, \u0433\u0434\u0435 \u0432\u043e\u0437\u0434\u0443\u0445 \u043d\u0430\u043f\u043e\u043b\u043d\u0435\u043d \u0437\u0430\u043f\u0430\u0445\u043e\u043c \u043c\u0451\u0434\u0430 \u0438 \u043b\u0430\u0432\u0430\u043d\u0434\u044b. \u041d\u0430 \u0441\u0442\u0435\u043d\u0430\u0445 \u0440\u0430\u0437\u0432\u0435\u0448\u0430\u043d\u044b \u0437\u0435\u0440\u043a\u0430\u043b\u0430, \u0438\u0441\u043a\u0430\u0436\u0430\u044e\u0449\u0438\u0435 \u0432\u0430\u0448\u0435 \u043e\u0442\u0440\u0430\u0436\u0435\u043d\u0438\u0435.", "actions": [{"text": "\u041f\u0440\u043e\u0445\u043e\u0434 \u043d\u0430 \u0441\u0435\u0432\u0435\u0440. \u041f\u0443\u0442\u044c \u0432\u0435\u0434\u0451\u0442 \u0432 \u043d\u0435\u0438\u0437\u0432\u0435\u0441\u0442\u043d\u043e\u0435.", "next": "15"}, {"text": "\u041f\u0440\u043e\u0445\u043e\u0434 \u043d\u0430 \u044e\u0433. \u0412\u043d\u0438\u0437, \u0432 \u043a\u043e\u043c\u043d\u0430\u0442\u0443 \u0441 \u043a\u043e\u0432\u0440\u0430\u043c\u0438.", "next": "7"}, {"text": "\u041f\u0440\u043e\u0445\u043e\u0434 \u043d\u0430 \u0437\u0430\u043f\u0430\u0434. \u041e\u0431\u0440\u0430\u0442\u043d\u043e \u043a \u0448\u0451\u043f\u043e\u0442\u0443.", "next": "5"}, {"text": "\u041f\u0440\u043e\u0445\u043e\u0434 \u043d\u0430 \u0432\u043e\u0441\u0442\u043e\u043a. \u041f\u0443\u0442\u044c \u0432\u0435\u0434\u0451\u0442 \u0447\u0435\u0440\u0435\u0437 \u0441\u0432\u0435\u0442\u043b\u044b\u0439 \u043a\u043e\u0440\u0438\u0434\u043e\u0440.", "next": "11"}]}, "7": {"title": "\u041a\u043e\u043c\u043d\u0430\u0442\u0430 #7", "description": "\u042d\u0442\u0430 \u043a\u043e\u043c\u043d\u0430\u0442\u0430 \u043d\u0430\u043f\u043e\u043c\u0438\u043d\u0430\u0435\u0442 \u0434\u0440\u0435\u0432\u043d\u0438\u0439 \u0431\u0438\u0431\u043b\u0438\u043e\u0442\u0435\u043a\u0430\u0440\u0441\u043a\u0438\u0439 \u0437\u0430\u043b. \u041f\u043e\u043b\u043a\u0438, \u0443\u0445\u043e\u0434\u044f\u0449\u0438\u0435 \u0432\u0432\u0435\u0440\u0445, \u043f\u043e\u043b\u043d\u044b \u0441\u0442\u0430\u0440\u0438\u043d\u043d\u044b\u0445 \u043a\u043d\u0438\u0433 \u0438 \u0441\u0432\u0438\u0442\u043a\u043e\u0432.", "actions": [{"text": "\u041f\u0440\u043e\u0445\u043e\u0434 \u043d\u0430 \u0441\u0435\u0432\u0435\u0440. \u041f\u0443\u0442\u044c \u043e\u0431\u0440\u0430\u0442\u043d\u043e \u043a \u0437\u0435\u0440\u043a\u0430\u043b\u0430\u043c.", "next": "6"}, {"text": "\u041f\u0440\u043e\u0445\u043e\u0434 \u043d\u0430 \u0432\u043e\u0441\u0442\u043e\u043a. \u0412 \u043a\u043e\u043c\u043d\u0430\u0442\u0443, \u0433\u0434\u0435 \u0432\u043e\u0437\u0434\u0443\u0445 \u043d\u0430\u043f\u043e\u043b\u043d\u0435\u043d \u0430\u0440\u043e\u043c\u0430\u0442\u0430\u043c\u0438.", "next": "8"}]}, "8": {"title": "\u041a\u043e\u043c\u043d\u0430\u0442\u0430 #8", "description": "\u0412\u044b \u043d\u0430\u0445\u043e\u0434\u0438\u0442\u0435\u0441\u044c \u0432 \u043a\u043e\u043c\u043d\u0430\u0442\u0435, \u043d\u0430\u043f\u043e\u043c\u0438\u043d\u0430\u044e\u0449\u0435\u0439 \u0442\u0440\u043e\u043d\u043d\u044b\u0439 \u0437\u0430\u043b. \u0412 \u0446\u0435\u043d\u0442\u0440\u0435 \u0441\u0442\u043e\u0438\u0442 \u043f\u0443\u0441\u0442\u043e\u0439 \u0442\u0440\u043e\u043d, \u043e\u043a\u0440\u0443\u0436\u0451\u043d\u043d\u044b\u0439 \u0441\u0442\u0430\u0442\u0443\u044f\u043c\u0438 \u0434\u0440\u0435\u0432\u043d\u0438\u0445 \u0441\u0442\u0440\u0430\u0436\u0435\u0439.", "actions": [{"text": "\u041f\u0440\u043e\u0445\u043e\u0434 \u043d\u0430 \u0437\u0430\u043f\u0430\u0434. \u041e\u0431\u0440\u0430\u0442\u043d\u043e \u043a \u043a\u043d\u0438\u0433\u0430\u043c.", "next": "7"}, {"text": "\u041f\u0440\u043e\u0445\u043e\u0434 \u043d\u0430 \u0432\u043e\u0441\u0442\u043e\u043a. \u041f\u0443\u0442\u044c \u0432\u0435\u0434\u0451\u0442 \u0447\u0435\u0440\u0435\u0437 \u043a\u043e\u0440\u0438\u0434\u043e\u0440 \u0441 \u043a\u043e\u043b\u043e\u043d\u043d\u0430\u043c\u0438.", "next": "9"}]}, "9": {"title": "\u041a\u043e\u043c\u043d\u0430\u0442\u0430 #9", "description": "\u042d\u0442\u0430 \u043a\u043e\u043c\u043d\u0430\u0442\u0430 \u043f\u043e\u043b\u043d\u0430 \u0437\u0432\u0443\u043a\u043e\u0432 \u043f\u0430\u0434\u0430\u044e\u0449\u0435\u0439 \u0432\u043e\u0434\u044b. \u0412 \u0446\u0435\u043d\u0442\u0440\u0435 \u043d\u0430\u0445\u043e\u0434\u0438\u0442\u0441\u044f \u0432\u043e\u0434\u043e\u043f\u0430\u0434, \u043f\u0430\u0434\u0430\u044e\u0449\u0438\u0439 \u0432 \u043f\u043e\u0434\u0437\u0435\u043c\u043d\u043e\u0435 \u043e\u0437\u0435\u0440\u043e, \u0435\u0433\u043e \u0431\u0440\u044b\u0437\u0433\u0438 \u0441\u043e\u0437\u0434\u0430\u044e\u0442 \u0440\u0430\u0434\u0443\u0433\u0443 \u0432 \u04 043b\u0443\u0431\u043e\u043a\u043e \u0432\u043d\u0438\u0437.", "actions": [{"text": "\u041f\u0440\u043e\u0445\u043e\u0434 \u043d\u0430 \u0432\u043e\u0441\u0442\u043e\u043a. \u041f\u0443\u0442\u044c \u043e\u0431\u0440\u0430\u0442\u043d\u043e \u043a \u0445\u0440\u0430\u043c\u0443.", "next": "13"}]}, "15": {"title": "\u041a\u043e\u043c\u043d\u0430\u0442\u0430 #15", "description": "\u0412\u044b \u043d\u0430\u0445\u043e\u0434\u0438\u0442\u0435\u0441\u044c \u0432 \u043a\u043e\u043c\u043d\u0430\u0442\u0435, \u043d\u0430\u043f\u043e\u043b\u043d\u0435\u043d\u043d\u043e\u0439 \u0441\u0432\u0435\u0442\u043e\u043c, \u0438\u0441\u0445\u043e\u0434\u044f\u0449\u0438\u043c \u0438\u0437 \u043a\u0440\u0438\u0441\u0442\u0430\u043b\u043b\u043e\u0432 \u043d\u0430 \u0441\u0442\u0435\u043d\u0430\u0445. \u0412 \u0446\u0435\u043d\u0442\u0440\u0435 \u0441\u0442\u043e\u0438\u0442 \u043f\u043e\u0440\u0442\u0430\u043b, \u0441\u0432\u0435\u0442\u044f\u0449\u0438\u0439\u0441\u044f \u044f\u0440\u043a\u0438\u043c \u0431\u0435\u043b\u044b\u043c \u0441\u0432\u0435\u0442\u043e\u043c.", "actions": [{"text": "\u041f\u0440\u043e\u0445\u043e\u0434 \u043d\u0430 \u0441\u0435\u0432\u0435\u0440. \u0412\u044b \u0432\u044b\u0431\u0440\u0430\u043b\u0438\u0441\u044c \u0438\u0437 \u043b\u0430\u0431\u0438\u0440\u0438\u043d\u0442\u0430!", "next": "end"}, {"text": "\u041f\u0440\u043e\u0445\u043e\u0434 \u043d\u0430 \u044e\u0433. \u041e\u0431\u0440\u0430\u0442\u043d\u043e \u043a \u0437\u0435\u0440\u043a\u0430\u043b\u0430\u043c.", "next": "6"}, {"text": "\u041f\u0440\u043e\u0445\u043e\u0434 \u043d\u0430 \u0437\u0430\u043f\u0430\u0434. \u041f\u0443\u0442\u044c \u0432\u0435\u0434\u0451\u0442 \u0447\u0435\u0440\u0435\u0437 \u043a\u043e\u043c\u043d\u0430\u0442\u0443 \u0441 \u0434\u0440\u0435\u0432\u043d\u0438\u043c\u0438 \u043a\u0440\u0438\u0441\u0442\u0430\u043b\u043b\u0430\u043c\u0438.", "next": "16"}]}, "16": {"title": "\u041a\u043e\u043c\u043d\u0430\u0442\u0430 #16", "description": "\u0412\u044b \u043d\u0430\u0445\u043e\u0434\u0438\u0442\u0435\u0441\u044c \u0432 \u043a\u043e\u043c\u043d\u0430\u0442\u0435, \u0433\u0434\u0435 \u0441\u0442\u0435\u043d\u044b \u043f\u043e\u043a\u0440\u044b\u0442\u044b \u043a\u0440\u0438\u0441\u0442\u0430\u043b\u043b\u0430\u043c\u0438, \u0438\u0437\u0434\u0430\u044e\u0449\u0438\u043c\u0438 \u043c\u0435\u043b\u043e\u0434\u0438\u0447\u043d\u044b\u0435 \u0437\u0432\u0443\u043a\u0438 \u043f\u0440\u0438 \u043f\u0440\u0438\u043a\u043e\u0441\u043d\u043e\u0432\u0435\u043d\u0438\u0438. \u0412 \u0446\u0435\u043d\u0442\u0440\u0435 \u043a\u043e\u043c\u043d\u0430\u0442\u044b \u0441\u0442\u043e\u0438\u0442 \u043a\u0430\u043c\u0435\u043d\u043d\u0430\u044f \u043f\u043b\u0438\u0442\u0430, \u043d\u0430 \u043a\u043e\u0442\u043e\u0440\u043e\u0439 \u0432\u044b\u0441\u0435\u0447\u0435\u043d\u0430 \u043a\u0430\u0440\u0442\u0430 \u043b\u0430\u0431\u0438\u0440\u0438\u043d\u0442\u0430.", "actions": [{"text": "\u041f\u0440\u043e\u0445\u043e\u0434 \u043d\u0430 \u0432\u043e\u0441\u0442\u043e\u043a. \u041f\u0443\u0442\u044c \u043e\u0431\u0440\u0430\u0442\u043d\u043e \u043a \u043f\u043e\u0440\u0442\u0430\u043b\u0443.", "next": "15"}]}};
        const images = {"1": "rooms/room1.jpg", "2": "rooms/room2.jpg", "3": "rooms/room3.jpg", "4": "rooms/room4.jpg", "5": "rooms/room5.jpg", "6": "rooms/room6.jpg", "7": "rooms/room7.jpg", "8": "rooms/room8.jpg", "9": "rooms/room9.jpg", "10": "rooms/room10.jpg", "11": "rooms/room11.jpg", "12": "rooms/room12.jpg", "13": "rooms/room13.jpg", "14": "rooms/room14.jpg", "15": "rooms/room15.jpg", "16": "rooms/room16.jpg"};
        let current_room = '1';
        
        function updateUI() {
            const roomData = rooms[current_room];
            const imgElement = document.getElementById('room-image');
            const roomTextDiv = document.getElementById('room-text');
            
            // Вывод пути для отладки
            console.log("Путь к изображению:", images[current_room]);
            
            // Обновляем изображение
            imgElement.src = images[current_room] || 'default.jpg';
            
            // Обновляем текстовое содержимое
            roomTextDiv.innerHTML = `
                <h2>${roomData.title}</h2>
                <p>${roomData.description}</p>
            `;
            
            // Динамическое оформление
            const roomDiv = document.getElementById('room');
            switch(current_room) {
                case '1': roomDiv.style.background = '#2d2d2d'; break;
                case '3': roomDiv.style.background = '#204030'; break;
                case '6': roomDiv.style.background = '#303050'; break;
                case '15': roomDiv.style.background = '#503050'; break;
                default: roomDiv.style.background = '#2d2d2d';
            }
            
            const actionsDiv = document.getElementById('actions');
            actionsDiv.innerHTML = '';
            
            roomData.actions.forEach(action => {
                const btn = document.createElement('button');
                btn.textContent = action.text;
                btn.onclick = () => {
                    if (action.next === 'end') {
                        alert('Вы выбрались из лабиринта!');
                        location.reload();
                    } else {
                        current_room = action.next || current_room;
                        updateUI();
                    }
                };
                actionsDiv.appendChild(btn);
            });
        }
        
        window.onload = () => {
            updateUI();
        };
    </script>
</body>
</html>
